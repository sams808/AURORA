[build-system]
requires = ["setuptools>=77"]               # PEP 639: license = "MIT" and license-files
build-backend = "setuptools.build_meta"

[project]
name = "aurora-sgm"
dynamic = ["version"]                       # aurora.__version__, the one version source
description = "AURORA: soft X-ray XAS and XRF stack analysis for the SGM beamline (Canadian Light Source)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sami Soudani"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "PySide6>=6.10",      # 6.9.1 paints no pyqtgraph curves or images at all (verified 2026-11-06); 6.12 works
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
    "xraydb>=4.5",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/sams808/AURORA"
Issues = "https://github.com/sams808/AURORA/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.dynamic]
version = {attr = "aurora.__version__"}

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.setuptools.package-data]
aurora = ["resources/*.png", "resources/*.ico", "resources/ui/*.svg", "resources/docs/*.md", "resources/docs/img/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
